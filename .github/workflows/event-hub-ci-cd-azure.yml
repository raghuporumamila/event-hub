            echo "Deployment rollout failed. Collecting diagnostics..."
            kubectl get deployment event-hub-backend-service -n ${K8S_NAMESPACE} -o wide || true
            kubectl get rs -n ${K8S_NAMESPACE} -l app=event-hub-backend-service -o wide || true
            kubectl get pods -n ${K8S_NAMESPACE} -l app=event-hub-backend-service -o wide || true
            kubectl describe deployment event-hub-backend-service -n ${K8S_NAMESPACE} || true
            kubectl describe pods -n ${K8S_NAMESPACE} -l app=event-hub-backend-service || true
            kubectl logs -n ${K8S_NAMESPACE} -l app=event-hub-backend-service --all-containers --tail=200 || true
            kubectl get events -n ${K8S_NAMESPACE} --sort-by=.metadata.creationTimestamp | tail -n 100 || true
            exit 1
