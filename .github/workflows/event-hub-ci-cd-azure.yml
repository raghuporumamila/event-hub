          sed \
            -e "s|namespace: prod|namespace: ${K8S_NAMESPACE}|g" \
            -e "s|REPLACE_WITH_BACKEND_SERVICE_IMAGE|${IMAGE_URI}|g" \
            services/event-hub-backend-service/deployment.yml | kubectl apply -f -

      - name: Verify rollout
