apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-hub-site
  labels:
    app: event-hub-site
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-hub-site
      tier: frontend
  template:
    metadata:
      labels:
        app: event-hub-site
        tier: frontend
    spec:
      containers:
        - name: event-hub-site
          image: us-central1-docker.pkg.dev/event-hub-317019/event-hub/event-hub-site:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: event-hub-site
  labels:
    app: event-hub-site
    tier: frontend
spec:
  selector:
    app: event-hub-site
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-hub-site-external-http
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-hub-site
                port:
                  number: 80