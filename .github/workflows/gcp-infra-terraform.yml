name: GCP Infra Terraform

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Terraform target"
        required: true
        default: "both"
        type: choice
        options:
          - project-services
          - gke
          - both
      operation:
        description: "Terraform operation"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terraform-project-services:
    name: Terraform project-services
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.target == 'project-services' || github.event.inputs.target == 'both' }}
    defaults:
      run:
        shell: bash
        working-directory: services/event-hub-infra-terraform/gcp/project-services
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TERRAFORM_SA_ID: ${{ vars.TERRAFORM_SA_ID }}
      WIF: ${{ vars.WIF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Terraform source version
        run: |
          echo "Git commit: $(git rev-parse HEAD)"
          echo "Working directory: $(pwd)"
          echo "Terraform files fingerprint:"
          sha256sum main.tf provider.tf variables.tf 2>/dev/null || true
          echo "Relevant main.tf snippet:"
          sed -n '1,120p' main.tf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate required environment variables
        run: |
          missing=0
          for v in GCP_PROJECT_ID TERRAFORM_SA_ID WIF; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub environment variable '$v' in environment 'prod'."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.TERRAFORM_SA_ID }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          if [ "${{ github.event.inputs.operation }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan -input=false
          else
            terraform plan -out=tfplan -input=false
          fi

      - name: Terraform apply
        if: ${{ github.event.inputs.operation == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ github.event.inputs.operation == 'destroy' }}
        run: terraform destroy -input=false -auto-approve

  terraform-gke:
    name: Terraform gke
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.target == 'gke' || github.event.inputs.target == 'both' }}
    defaults:
      run:
        shell: bash
        working-directory: services/event-hub-infra-terraform/gcp/gke
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TERRAFORM_SA_ID: ${{ vars.TERRAFORM_SA_ID }}
      WIF: ${{ vars.WIF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Terraform source version
        run: |
          echo "Git commit: $(git rev-parse HEAD)"
          echo "Working directory: $(pwd)"
          echo "Terraform files fingerprint:"
          sha256sum main.tf provider.tf variables.tf 2>/dev/null || true
          echo "Relevant main.tf snippet:"
          sed -n '1,120p' main.tf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate required environment variables
        run: |
          missing=0
          for v in GCP_PROJECT_ID TERRAFORM_SA_ID WIF; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub environment variable '$v' in environment 'prod'."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.TERRAFORM_SA_ID }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Remove legacy service resources from state
        run: |
          for r in google_project_service.compute google_project_service.container google_project_service.storage; do
            if terraform state list | grep -qx "$r"; then
              echo "Removing legacy state resource: $r"
              terraform state rm "$r"
            fi
          done

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          if [ "${{ github.event.inputs.operation }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan -input=false
          else
            terraform plan -out=tfplan -input=false
          fi

      - name: Terraform apply
        if: ${{ github.event.inputs.operation == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ github.event.inputs.operation == 'destroy' }}
        run: terraform destroy -input=false -auto-approve
