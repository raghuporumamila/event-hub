server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventhub}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      initialization-fail-timeout: -1  # retry indefinitely on startup instead of failing fast
      connection-timeout: 300000       # wait up to 5 min for a connection (survive AlloyDB self-restart)

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true

evenhub:
  rest:
    client:
      #daoApiEndpoint: http://192.168.4.152:30080
      daoApiEndpoint: ${DAO_API_ENDPOINT:http://event-hub-backend-service:8080}
      schemaApiEndpoint: ${SCHEMA_API_ENDPOINT:http://event-hub-schema:8080}
      publisherApiEndpoint: http://localhost:8083
      genAIAPIEndpoint: http://localhost:8000