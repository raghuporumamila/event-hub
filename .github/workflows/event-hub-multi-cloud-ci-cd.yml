          kubectl get statefulset alloydb -n ${K8S_NAMESPACE} -o wide
          kubectl get pods -n ${K8S_NAMESPACE} -l app=alloydb -o wide
          kubectl get svc -n ${K8S_NAMESPACE} -l app=alloydb -o wide
