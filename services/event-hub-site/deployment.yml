apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-hub-site
  namespace: prod
  labels:
    app: event-hub-site
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-hub-site
      tier: frontend
  template:
    metadata:
      labels:
        app: event-hub-site
        tier: frontend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: event-hub-app
      containers:
        - name: event-hub-site
          image: REPLACE_WITH_SITE_IMAGE
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://alloydb:5432/eventhub
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alloydb-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: event-hub-site
  namespace: prod
  labels:
    app: event-hub-site
    tier: frontend
spec:
  selector:
    app: event-hub-site
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-hub-site-external-http
  namespace: prod
spec:
  ingressClassName: REPLACE_WITH_INGRESS_CLASS_NAME
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-hub-site
                port:
                  number: 80