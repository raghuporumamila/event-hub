
<!DOCTYPE html>
<html lang="en">
<head>
<th:block th:include="~{fragments/manageCRUD :: headerfiles}">
</th:block>
</head>
<body>
        <div class="table-wrapper">
            <div class="table-title">
                <div class="row">
                    <div class="col-sm-6">
						<h2>Manage <b>sources</b></h2>
					</div>
					<div class="col-sm-6">
						<a href="#addModal" class="btn btn-success" data-toggle="modal"><i class="material-icons">&#xE147;</i> <span>Add New Source</span></a>
					</div>
                </div>
            </div>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
						<th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
						</th>
                        <!-- <th>ID</th> -->
                        <th>Name</th>
						<th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="orgSourceType : ${orgSourceTypes}">
						<td>
							<span class="custom-checkbox">
								<input type="checkbox" th:id="|checkbox-${orgSourceType.id}|" name="options[]" th:value="${orgSourceType.id}">
								<label th:for="|checkbox-${orgSourceType.id}|"></label>
							</span>
						</td>
                       <!--  <td th:text="${source.id}"></td> -->
                        <td th:text="${orgSourceType.name}"></td>
						<td th:text="${orgSourceType.type}"></td>
                        <td>
							<a href="#editModal" class="edit source-edit-trigger" data-toggle="modal" th:attr="data-source-id=${orgSourceType.id},data-source-name=${orgSourceType.name},data-source-type=${orgSourceType.type}"><i class="material-icons" data-toggle="tooltip" title="Edit">edit</i></a>
							<a href="#deleteModal" class="delete source-delete-trigger" data-toggle="modal" th:attr="data-source-id=${orgSourceType.id}"><i class="material-icons" data-toggle="tooltip" title="Delete">delete</i></a>
                        </td>
                    </tr>
                   
                </tbody>
            </table>
        </div>
	<!-- Edit Modal HTML -->
	<div id="addModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="addSourceForm" hx-post="/site/v1/createSource" hx-target="#contentArea" hx-swap="innerHTML">
					<div class="modal-header">						
						<h4 class="modal-title">Add Source</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<div class="form-group">
							<label>Name</label>
							<input type="text" class="form-control" id="name" name="name">
						</div>
						
						<div class="form-group">
							<label>Type</label>
							<select id="type" name="type" class="form-control">
								<option>Select....</option>

      							<option th:each="sourceType : ${T(com.eventhub.model.SourceTypeEnum).values()}" th:value="${sourceType.name()}" th:text="${sourceType.name()}"></option>
    						</select>
						</div>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="submit" class="btn btn-success" value="Add">
					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Edit Modal HTML -->
	<div id="editModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="updateSourceForm" hx-post="/site/v1/updateSource" hx-target="#contentArea" hx-swap="innerHTML">
					<div class="modal-header">						
						<h4 class="modal-title">Edit Source</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<input type="hidden" id="editSourceId" name="id">
						<div class="form-group">
							<label>Name</label>
							<input type="text" class="form-control" id="editSourceName" name="name" required>
						</div>
						<div class="form-group">
							<label>Type</label>
							<select id="editSourceType" name="type" class="form-control" required>
								<option>Select....</option>
								<option th:each="sourceType : ${T(com.eventhub.model.SourceTypeEnum).values()}" th:value="${sourceType.name()}" th:text="${sourceType.name()}"></option>
							</select>
						</div>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="submit" class="btn btn-info" value="Save">
					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Delete Modal HTML -->
	<div id="deleteModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="deleteSourceForm" hx-post="/site/v1/deleteSource" hx-target="#contentArea" hx-swap="innerHTML">
					<div class="modal-header">						
						<h4 class="modal-title">Delete Source</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<input type="hidden" id="deleteSourceId" name="id">
						<p>Are you sure you want to delete these Records?</p>
						<p class="text-warning"><small>This action cannot be undone.</small></p>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="submit" class="btn btn-danger" value="Delete">
					</div>
				</form>
			</div>
		</div>
	</div>
	<script th:src="@{/js/manage-sources-page.js}"></script>
</body>
</html>
