          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${ACR_NAME}

      - name: Compute image metadata
        id: meta
        run: |
          ACR_LOGIN_SERVER="$(az acr show --name ${ACR_NAME} --query loginServer -o tsv)"
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:event-hub-site-${IMAGE_TAG}"
          IMAGE_LATEST_URI="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:event-hub-site-latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_latest_uri=${IMAGE_LATEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --build-arg APP_VERSION=1.0.0 \
            --build-arg COMMIT_SHA=${GITHUB_SHA} \
            -f services/event-hub-site/Dockerfile \
            -t ${{ steps.meta.outputs.image_uri }} \
            services
          docker tag ${{ steps.meta.outputs.image_uri }} ${{ steps.meta.outputs.image_latest_uri }}

      - name: Push container image
        run: |
          docker push ${{ steps.meta.outputs.image_uri }}
          docker push ${{ steps.meta.outputs.image_latest_uri }}

  deploy-event-hub-schema-azure:
    name: Deploy event-hub-schema to AKS prod
    runs-on: ubuntu-latest
    environment: prod
    needs: build-event-hub-schema-azure
    if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'schema' }}
    env:
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      APP_AZURE_CLIENT_ID: ${{ vars.APP_AZURE_CLIENT_ID }}
      K8S_NAMESPACE: ${{ github.event.inputs.k8s_namespace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for v in AZURE_DEPLOY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AKS_CLUSTER_NAME AKS_RESOURCE_GROUP ACR_NAME APP_AZURE_CLIENT_ID K8S_NAMESPACE; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub environment variable '$v' in environment 'prod'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure kubectl for AKS
        run: az aks get-credentials --resource-group ${AKS_RESOURCE_GROUP} --name ${AKS_CLUSTER_NAME} --overwrite-existing

      - name: Show kubectl context
        run: |
          echo "Current context: $(kubectl config current-context)"
          echo "Namespace: ${K8S_NAMESPACE}"
          kubectl cluster-info

      - name: Ensure namespace exists
        run: kubectl get namespace ${K8S_NAMESPACE} >/dev/null 2>&1 || kubectl create namespace ${K8S_NAMESPACE}

      - name: Apply service account and deployment manifest
        run: |
          set -euo pipefail
          ACR_LOGIN_SERVER="$(az acr show --name ${ACR_NAME} --query loginServer -o tsv)"
          IMAGE_URI="${ACR_LOGIN_SERVER}/$(cut -d';' -f1 <<< '${{ needs.build-event-hub-schema-azure.outputs.image_uri }}')"
          IMAGE_URI="${{ needs.build-event-hub-schema-azure.outputs.image_uri }}"

          sed \
            -e "s|namespace: prod|namespace: ${K8S_NAMESPACE}|g" \
            services/event-hub-app-service-account.yml | kubectl apply -f -

          sed \
            -e "s|namespace: prod|namespace: ${K8S_NAMESPACE}|g" \
            -e "s|REPLACE_WITH_AZURE_CLIENT_ID|${APP_AZURE_CLIENT_ID}|g" \
            services/event-hub-app-service-account-azure.yml | kubectl apply -f -

          sed \
            -e "s|namespace: prod|namespace: ${K8S_NAMESPACE}|g" \
            -e "s|REPLACE_WITH_SCHEMA_IMAGE|${IMAGE_URI}|g" \
            services/event-hub-schema/deployment.yml | kubectl apply -f -

      - name: Verify rollout
        run: |
          set -e
          if ! kubectl rollout status deployment/event-hub-schema -n ${K8S_NAMESPACE} --timeout=420s; then
            echo "Deployment rollout failed. Collecting diagnostics..."
            kubectl get deployment event-hub-schema -n ${K8S_NAMESPACE} -o wide || true
            kubectl get rs -n ${K8S_NAMESPACE} -l app=event-hub-schema -o wide || true
            kubectl get pods -n ${K8S_NAMESPACE} -l app=event-hub-schema -o wide || true
            kubectl describe deployment event-hub-schema -n ${K8S_NAMESPACE} || true
            kubectl describe pods -n ${K8S_NAMESPACE} -l app=event-hub-schema || true
            kubectl logs -n ${K8S_NAMESPACE} -l app=event-hub-schema --all-containers --tail=200 || true
            kubectl get events -n ${K8S_NAMESPACE} --sort-by=.metadata.creationTimestamp | tail -n 100 || true
            exit 1
          fi

      - name: Show deployed workload
        run: |
          kubectl get deployment event-hub-schema -n ${K8S_NAMESPACE} -o wide
          kubectl get pods -n ${K8S_NAMESPACE} -l app=event-hub-schema -o wide

