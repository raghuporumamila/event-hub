  deploy-event-hub-schema-gcp:
    name: Deploy event-hub-schema to GKE prod
    runs-on: ubuntu-latest
    environment: prod
    needs: build-event-hub-schema-gcp
    if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'schema' }}
    env:
      GCP_CICD_GITHUB_SA: ${{ vars.GCP_CICD_GITHUB_SA }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_APP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_APP_SERVICE_ACCOUNT_EMAIL }}
      GCP_WIF: ${{ vars.GCP_WIF }}
      K8S_NAMESPACE: ${{ github.event.inputs.k8s_namespace }}

    steps:
      - name: Checkout
