---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alloydb
  labels:
    app: alloydb
    tier: database
spec:
  serviceName: alloydb
  replicas: 1
  selector:
    matchLabels:
      app: alloydb
      tier: database
  template:
    metadata:
      labels:
        app: alloydb
        tier: database
    spec:
      containers:
        - name: alloydb
          image: google/alloydbomni:latest
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alloydb-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: DATA_DIR
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: init-sql
          configMap:
            name: alloydb-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: alloydb
          tier: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alloydb
  labels:
    app: alloydb
    tier: database
spec:
  clusterIP: None
  selector:
    app: alloydb
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: alloydb-nodeport
  labels:
    app: alloydb
    tier: database
spec:
  selector:
    app: alloydb
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
      protocol: TCP
  type: NodePort
