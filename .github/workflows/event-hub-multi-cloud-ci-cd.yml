name: Event Hub Multi-Cloud API Services CI/CD

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Target cloud platform
        required: true
        default: gcp
        type: choice
        options:
          - gcp
          - aws
          - azure
      aws_region:
        description: AWS region (AWS only)
        required: false
        default: us-east-2
        type: string
      ar_location:
        description: Artifact Registry location (GCP only, e.g., us-central1)
        required: false
        default: us-central1
        type: string
      registry_repository:
        description: Container registry repository name
        required: true
        default: event-hub
        type: string
      k8s_namespace:
        description: Kubernetes namespace for deployment
        required: true
        default: prod
        type: string
      deploy_target:
        description: Which service(s) to deploy (schema, backend, site, db, or all)
        required: true
        default: all
        type: choice
        options:
          - all
          - schema
          - backend
          - site
          - db

permissions:
  contents: read
  id-token: write

env:
  CLOUD: ${{ github.event.inputs.cloud }}

jobs:
  # GCP Build Jobs
  build-event-hub-schema-gcp:
    name: Build and push event-hub-schema image (GCP)
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.cloud == 'gcp' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'schema') }}
    env:
      GCP_CICD_GITHUB_SA: ${{ vars.GCP_CICD_GITHUB_SA }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF: ${{ vars.GCP_WIF }}
      AR_LOCATION: ${{ github.event.inputs.ar_location }}
      AR_REPOSITORY: ${{ github.event.inputs.registry_repository }}
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_latest_uri: ${{ steps.meta.outputs.image_latest_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for v in GCP_CICD_GITHUB_SA GCP_PROJECT_ID GCP_WIF; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub environment variable '$v' in environment 'prod'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${AR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/event-hub-schema:${IMAGE_TAG}"
          IMAGE_LATEST_URI="${AR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/event-hub-schema:latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_latest_uri=${IMAGE_LATEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF }}
          service_account: ${{ env.GCP_CICD_GITHUB_SA }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${AR_LOCATION}-docker.pkg.dev --quiet

      - name: Build container image
        run: |
          docker build \
            --build-arg APP_VERSION=1.0.0 \
            --build-arg COMMIT_SHA=${GITHUB_SHA} \
            -f services/event-hub-schema/Dockerfile \
            -t ${{ steps.meta.outputs.image_uri }} \
            services
          docker tag ${{ steps.meta.outputs.image_uri }} ${{ steps.meta.outputs.image_latest_uri }}

      - name: Push container image
        run: |
          docker push ${{ steps.meta.outputs.image_uri }}
          docker push ${{ steps.meta.outputs.image_latest_uri }}

  # AWS Build Jobs
  build-event-hub-schema-aws:
    name: Build and push event-hub-schema image (AWS)
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.cloud == 'aws' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'schema') }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ github.event.inputs.aws_region }}
      ECR_REPOSITORY: ${{ github.event.inputs.registry_repository }}
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_latest_uri: ${{ steps.meta.outputs.image_latest_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for v in AWS_DEPLOY_ROLE_ARN AWS_ACCOUNT_ID AWS_REGION ECR_REPOSITORY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub environment variable '$v' in environment 'prod'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:event-hub-schema-${IMAGE_TAG}"
          IMAGE_LATEST_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:event-hub-schema-latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_latest_uri=${IMAGE_LATEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --build-arg APP_VERSION=1.0.0 \
            --build-arg COMMIT_SHA=${GITHUB_SHA} \
            -f services/event-hub-schema/Dockerfile \
            -t ${{ steps.meta.outputs.image_uri }} \
            services
          docker tag ${{ steps.meta.outputs.image_uri }} ${{ steps.meta.outputs.image_latest_uri }}

      - name: Push container image
        run: |
          docker push ${{ steps.meta.outputs.image_uri }}
          docker push ${{ steps.meta.outputs.image_latest_uri }}

  # Azure Build Jobs
  build-event-hub-schema-azure:
    name: Build and push event-hub-schema image (Azure)
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.cloud == 'azure' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'schema') }}
    env:
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: ${{ github.event.inputs.registry_repository }}
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_latest_uri: ${{ steps.meta.outputs.image_latest_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for v in AZURE_DEPLOY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_REPOSITORY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub environment variable '$v' in environment 'prod'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${ACR_NAME}

      - name: Compute image metadata
        id: meta
        run: |
          ACR_LOGIN_SERVER="$(az acr show --name ${ACR_NAME} --query loginServer -o tsv)"
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:event-hub-schema-${IMAGE_TAG}"
          IMAGE_LATEST_URI="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:event-hub-schema-latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_latest_uri=${IMAGE_LATEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
