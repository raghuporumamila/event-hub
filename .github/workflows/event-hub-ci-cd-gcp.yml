          sed -e "s|namespace: prod|namespace: ${K8S_NAMESPACE}|g" \
            services/event-hub-db-server/deployment.yml | kubectl apply -f -

      - name: Verify StatefulSet rollout
        run: |
          set -e
          if ! kubectl rollout status statefulset/alloydb -n ${K8S_NAMESPACE} --timeout=600s; then
            echo "StatefulSet rollout failed. Collecting diagnostics..."
            kubectl get statefulset alloydb -n ${K8S_NAMESPACE} -o wide || true
            kubectl get pods -n ${K8S_NAMESPACE} -l app=alloydb -o wide || true
            kubectl describe statefulset alloydb -n ${K8S_NAMESPACE} || true
            kubectl describe pods -n ${K8S_NAMESPACE} -l app=alloydb || true
            kubectl logs -n ${K8S_NAMESPACE} -l app=alloydb --all-containers --tail=200 || true
