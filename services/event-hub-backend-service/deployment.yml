apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-hub-backend-service
  labels:
    app: event-hub-backend-service
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-hub-backend-service
      tier: api
  template:
    metadata:
      labels:
        app: event-hub-backend-service
        tier: api
    spec:
      containers:
        - name: event-hub-backend-service
          image: us-central1-docker.pkg.dev/event-hub-317019/event-hub/event-hub-backend-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20