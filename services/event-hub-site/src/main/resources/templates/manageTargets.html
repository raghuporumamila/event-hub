
<!DOCTYPE html>
<html lang="en">
<head>
<th:block th:include="~{fragments/manageCRUD :: headerfiles}">
</th:block>
</head>
<body>
        <div class="table-wrapper">
            <div class="table-title">
                <div class="row">
                    <div class="col-sm-6">
						<h2>Manage <b>targets</b></h2>
					</div>
					<div class="col-sm-6">
						<a href="#addModal" class="btn btn-success" data-toggle="modal"><span aria-hidden="true">+</span>&nbsp;<span>Add New Target</span></a>
					</div>
                </div>
            </div>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
						<th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
						</th>
                        <!-- <th>ID</th> -->
                        <th>Name</th>
						<th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="orgTarget : ${orgTargets}">
						<td>
							<span class="custom-checkbox">
								<input type="checkbox" th:id="|checkbox-${orgTarget.id}|" name="options[]" th:value="${orgTarget.id}">
								<label th:for="|checkbox-${orgTarget.id}|"></label>
							</span>
						</td>
                       <!-- <td th:text="${orgTarget.id}"></td> --> 
                        <td th:text="${orgTarget.name}"></td>
						<td th:text="${orgTarget.type}"></td>
                        <td>
							<a href="#editModal" class="edit target-edit-trigger" data-toggle="modal" th:attr="data-target-id=${orgTarget.id},data-target-name=${orgTarget.name},data-target-type=${orgTarget.type},data-target-credentials=${orgTarget.credentials}"><i class="material-icons" data-toggle="tooltip" title="Edit">edit</i></a>
							<a href="#deleteModal" class="delete" data-toggle="modal"><i class="material-icons" data-toggle="tooltip" title="Delete">delete</i></a>
                        </td>
                    </tr>
                   
                </tbody>
            </table>
            <!-- 
			<div class="clearfix">
                <div class="hint-text">Showing <b>5</b> out of <b>25</b> entries</div>
                <ul class="pagination">
                    <li class="page-item disabled"><a href="#">Previous</a></li>
                    <li class="page-item"><a href="#" class="page-link">1</a></li>
                    <li class="page-item"><a href="#" class="page-link">2</a></li>
                    <li class="page-item active"><a href="#" class="page-link">3</a></li>
                    <li class="page-item"><a href="#" class="page-link">4</a></li>
                    <li class="page-item"><a href="#" class="page-link">5</a></li>
                    <li class="page-item"><a href="#" class="page-link">Next</a></li>
                </ul>
            </div>
             -->
        </div>
	<!-- Edit Modal HTML -->
	<div id="addModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="addTargetForm" hx-post="/site/v1/createTarget" hx-target="#contentArea" hx-swap="innerHTML">
					<div class="modal-header">						
						<h4 class="modal-title">Add Target</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<div class="form-group">
							<label>Name</label>
							<input type="text" id="name" name="name" class="form-control" required>
						</div>
						<div class="form-group">
							<label>Type</label>
							<select id="type" name="type" class="form-control">
								<option>Select....</option>
								<option th:each="targetType : ${T(com.eventhub.model.TargetTypeEnum).values()}" th:value="${targetType.name()}" th:text="${targetType.name()}"></option>
							</select>
						</div>
						<div class="form-group">
							<label for="credentials">Credentials</label>
							<textarea id="credentials" name="credentials" class="form-control" rows="5" required></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="submit" class="btn btn-success" value="Add">
					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Edit Modal HTML -->
	<div id="editModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="editTargetForm" hx-post="/site/v1/updateTarget" hx-target="#contentArea" hx-swap="innerHTML">
					<div class="modal-header">						
						<h4 class="modal-title">Edit Target</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<input type="hidden" id="editTargetId" name="id">
						<div class="form-group">
							<label>Name</label>
							<input type="text" id="editTargetName" name="name" class="form-control" required>
						</div>
						<div class="form-group">
							<label>Type</label>
							<select id="editTargetType" name="type" class="form-control" required>
								<option>Select....</option>
								<option th:each="targetType : ${T(com.eventhub.model.TargetTypeEnum).values()}" th:value="${targetType.name()}" th:text="${targetType.name()}"></option>
							</select>
						</div>
						<div class="form-group">
							<label>Credentials</label>
							<textarea id="editTargetCredentials" name="credentials" class="form-control" rows="5" required></textarea>
						</div>			
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="submit" class="btn btn-info" value="Save">
					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Delete Modal HTML -->
	<div id="deleteModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form>
					<div class="modal-header">						
						<h4 class="modal-title">Delete Target</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<p>Are you sure you want to delete these Records?</p>
						<p class="text-warning"><small>This action cannot be undone.</small></p>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="button" class="btn btn-danger" value="Delete">
					</div>
				</form>
			</div>
		</div>
	</div>
		<script th:src="@{/js/manage-targets-page.js}"></script>
</body>
</html>
