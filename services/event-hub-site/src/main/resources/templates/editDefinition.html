<div class="modal-dialog">
	<div class="modal-content">
		<form id="updateDefinitionForm" hx-post="/site/v1/updateDefinition" hx-target="#contentArea" hx-swap="innerHTML">
			<input type="hidden" name="id" th:value="${definition.id}"/>
			<div class="modal-header">
				<h4 class="modal-title">Edit Definition</h4>
				<button type="button" class="close" data-dismiss="modal"
					aria-hidden="true">&times;</button>
			</div>
			<div class="modal-body">
				<div class="form-group">
					<label>Name</label> <input type="text" class="form-control"
						th:value="${definition.eventName}" readonly></input>
				</div>
				<div class="form-group">
					<label>Source</label> <input type="text" class="form-control"
						th:value="${definition.source.name}" readonly></input>
				</div>
				<div class="form-group">
					<label>Schema</label>
					<textarea id="schema" name="payloadSchema" cols="120" rows="25"
						class="form-control" th:text="${definition.payloadSchema}"></textarea>
				</div>
			</div>
			<div class="modal-footer">
				<input type="button" class="btn btn-default" data-dismiss="modal"
					value="Cancel"> <input type="submit" class="btn btn-info"
					value="Save">
			</div>
		</form>
	</div>
</div>
