name: Event Hub Azure CI/CD

on:
  workflow_dispatch:
    inputs:
      registry_repository:
        description: Container registry repository name
        required: true
        default: event-hub
        type: string
      k8s_namespace:
        description: Kubernetes namespace for deployment
        required: true
        default: prod
        type: string
      deploy_target:
        description: Which service(s) to deploy (schema, backend, site, db, or all)
        required: true
        default: all
        type: choice
        options:
          - all
          - schema
          - backend
          - site
          - db

permissions:
  contents: read
  id-token: write

jobs:
  build-event-hub-schema-azure:
    name: Build and push event-hub-schema image (Azure)
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'schema' }}
    env:
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: ${{ github.event.inputs.registry_repository }}
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_latest_uri: ${{ steps.meta.outputs.image_latest_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for v in AZURE_DEPLOY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_REPOSITORY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub environment variable '$v' in environment 'prod'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${ACR_NAME}

      - name: Compute image metadata
        id: meta
        run: |
          ACR_LOGIN_SERVER="$(az acr show --name ${ACR_NAME} --query loginServer -o tsv)"
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:event-hub-schema-${IMAGE_TAG}"
          IMAGE_LATEST_URI="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:event-hub-schema-latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_latest_uri=${IMAGE_LATEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --build-arg APP_VERSION=1.0.0 \
            --build-arg COMMIT_SHA=${GITHUB_SHA} \
            -f services/event-hub-schema/Dockerfile \
            -t ${{ steps.meta.outputs.image_uri }} \
            services
          docker tag ${{ steps.meta.outputs.image_uri }} ${{ steps.meta.outputs.image_latest_uri }}

      - name: Push container image
        run: |
          docker push ${{ steps.meta.outputs.image_uri }}
          docker push ${{ steps.meta.outputs.image_latest_uri }}

  build-event-hub-backend-service-azure:
    name: Build and push event-hub-backend-service image (Azure)
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'backend' }}
    env:
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
