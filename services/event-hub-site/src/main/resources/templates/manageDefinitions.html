
<!DOCTYPE html>
<html lang="en">
<head>
<th:block th:include="~{fragments/manageCRUD :: headerfiles}">
</th:block>
</head>
<body>
        <div class="table-wrapper">
            <div class="table-title">
                <div class="row">
                    <div class="col-sm-6">
						<h2>Manage <b>sources</b></h2>
					</div>
					<div class="col-sm-6">
						<a href="#addModal" class="btn btn-success" data-toggle="modal"><span aria-hidden="true">+</span>&nbsp;<span>Add New Definition</span></a>
					</div>
                </div>
            </div>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
						<th>
							<span class="custom-checkbox">
								<input type="checkbox" id="selectAll">
								<label for="selectAll"></label>
							</span>
						</th>
                        <th>Event Name</th>
                        <th>Source</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="definition : ${definitions}">
						<td>
							<span class="custom-checkbox">
								<input type="checkbox" th:id="|checkbox-${definition.id}|" name="options[]" th:value="${definition.id}">
								<label th:for="|checkbox-${definition.id}|"></label>
							</span>
						</td>
                        <td th:text="${definition.eventName}"></td>
						<td th:text="${definition.source.name}"></td>
                        <td>
							<a href="#editModal" class="edit" data-toggle="modal" th:attr="hx-get=|/site/v1/editDefinition?id=${definition.id}|" hx-target="#editModal" hx-swap="innerHTML"><i class="material-icons" data-toggle="tooltip" title="Edit">edit</i></a>
							<a href="#deleteModal" class="delete definition-delete-trigger" data-toggle="modal" th:attr="data-definition-id=${definition.id}"><i class="material-icons" data-toggle="tooltip" title="Delete">delete</i></a>
                        </td>
                    </tr>
                   
                </tbody>
            </table>
            <!-- 
			<div class="clearfix">
                <div class="hint-text">Showing <b>5</b> out of <b>25</b> entries</div>
                <ul class="pagination">
                    <li class="page-item disabled"><a href="#">Previous</a></li>
                    <li class="page-item"><a href="#" class="page-link">1</a></li>
                    <li class="page-item"><a href="#" class="page-link">2</a></li>
                    <li class="page-item active"><a href="#" class="page-link">3</a></li>
                    <li class="page-item"><a href="#" class="page-link">4</a></li>
                    <li class="page-item"><a href="#" class="page-link">5</a></li>
                    <li class="page-item"><a href="#" class="page-link">Next</a></li>
                </ul>
            </div>
             -->
        </div>
	<!-- Edit Modal HTML -->
	<div id="addModal" class="modal fade" role="dialog">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="addDefinitionForm" hx-post="/site/v1/createDefinition" hx-target="#contentArea" hx-swap="innerHTML">
					<div class="modal-header">						
						<h4 class="modal-title">Add Definition</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<div class="form-group">
							<label>Name</label>
							<input type="text" class="form-control" name="eventName">
						</div>
						<div class="form-group">
							<label>Source</label>
							<select class="form-control" name="source.id">
					      <option th:each="source : ${sources}" th:value="${source.id}" th:text="${source.name}"></option>
					    </select>
						</div>
						
						<div class="form-group">
							<label>Schema</label>
							<textarea name="payloadSchema" cols="120" rows="25" class="form-control" required></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="submit" class="btn btn-success" value="Add">
					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Edit Modal HTML -->
	<div id="editModal" class="modal fade">
		
	</div>
	<!-- Delete Modal HTML -->
	<div id="deleteModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="deleteDefinitionForm" hx-post="/site/v1/deleteDefinition" hx-target="#contentArea" hx-swap="innerHTML">
					<div class="modal-header">						
						<h4 class="modal-title">Delete Definition</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">					
						<input type="hidden" id="deleteDefinitionId" name="id">
						<p>Are you sure you want to delete these Records?</p>
						<p class="text-warning"><small>This action cannot be undone.</small></p>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input type="submit" class="btn btn-danger" value="Delete">
					</div>
				</form>
			</div>
		</div>
	</div>
	<script th:src="@{/js/manage-definitions-page.js}"></script>
</body>
</html>
